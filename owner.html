<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>بسيطة · لوحة المالك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08090D;--surf:#101218;--surf2:#171A22;--line:#20242F;--line2:#2C313F;
  --txt:#F2F4F8;--txt2:#848DA3;--txt3:#4E5567;
  --ac:#5FD4E8;--ac-d:#2FA9C0;--ac-l:#12242A;
  --ok:#17C787;--warn:#F0A93B;--danger:#E85D52;--r:18px;--nav:66px;
  --sh:0 8px 24px -10px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font-family:'IBM Plex Sans Arabic',sans-serif;font-size:14.5px;
  display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
h1,h2,h3,.kufi{font-family:'Cairo';font-weight:800;margin:0;letter-spacing:-.3px}
.num{font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font-family:inherit;font-size:16px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

.app{width:100%;max-width:412px;height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}

#boot{position:absolute;inset:0;z-index:200;background:radial-gradient(circle at 50% 30%,#0F2229,#08090D 70%);
  display:grid;place-items:center;transition:opacity .6s ease,visibility .6s}
#boot.gone{opacity:0;visibility:hidden;pointer-events:none}
#boot .in{text-align:center}
#boot .mk{width:64px;height:64px;margin:0 auto 16px;animation:bootIn .8s cubic-bezier(.2,.8,.2,1)}
@keyframes bootIn{from{opacity:0;transform:scale(.7) rotate(-10deg)}}
#boot b{font-family:'Cairo';color:#fff;font-size:19px;letter-spacing:2px;display:block}
#boot span{color:var(--ac);font-size:10.5px;letter-spacing:3px;font-weight:600}
#boot .bar{width:130px;height:3px;background:rgba(255,255,255,.1);border-radius:9px;margin:20px auto 0;overflow:hidden}
#boot .bar i{display:block;height:100%;width:0;background:var(--ac);animation:ld 1.3s ease forwards;border-radius:9px}
@keyframes ld{to{width:100%}}

#loginFlow{position:absolute;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;
  padding:32px 26px;opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s ease;pointer-events:none}
#loginFlow.show{opacity:1;transform:none;pointer-events:auto}
.spacer{flex:1}
.lmark{width:76px;height:76px;margin:0 auto 20px}
h1.ltitle{font-size:22px;text-align:center}
p.lsub{color:var(--txt2);text-align:center;margin:9px 0 0;font-size:13px;line-height:1.7}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12.5px;font-weight:600;margin-bottom:7px;color:var(--txt2)}
.fld input{width:100%;padding:15px;border:1.5px solid var(--line);border-radius:14px;
  background:var(--surf2);color:var(--txt);outline:0;transition:.2s;text-align:center;letter-spacing:6px;font-family:'Cairo'}
.fld input:focus{border-color:var(--ac)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;
  border-radius:15px;font-family:'Cairo';font-weight:700;font-size:15px;transition:.15s}
.btn:active{transform:scale(.98)}
.btn-p{background:var(--ac);color:#04191F;box-shadow:0 10px 26px -10px rgba(95,212,232,.4)}
.demo-hint{background:var(--ac-l);color:var(--ac);border-radius:12px;padding:11px 14px;font-size:12.5px;
  text-align:center;margin-top:12px;border:1px dashed rgba(95,212,232,.3)}

#mainApp{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;transition:opacity .5s ease .1s}
#mainApp.show{opacity:1}
.top{padding:14px 16px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;
  background:rgba(8,9,13,.92);backdrop-filter:blur(14px)}
.top-r{display:flex;align-items:center;gap:10px}
.mark{width:30px;height:30px;flex:0 0 auto}
.brand b{font-family:'Cairo';font-size:15px;display:block;line-height:1.1}
.brand span{font-size:9px;color:var(--ac);letter-spacing:1.6px;font-weight:600}
.live{margin-inline-start:auto;display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--txt3)}
.live i{width:6px;height:6px;border-radius:50%;background:var(--ac);animation:pu 2s infinite;display:block}
@keyframes pu{0%,100%{box-shadow:0 0 0 0 rgba(95,212,232,.5)}50%{box-shadow:0 0 0 5px rgba(95,212,232,0)}}
.role-tag{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--txt2);margin-top:10px}
.role-tag b{color:var(--txt)}

.body{flex:1;overflow-y:auto;padding-bottom:calc(var(--nav) + 12px)}
.body::-webkit-scrollbar{width:0}
.pad{padding:0 16px}

.kpis2{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:14px 16px 0}
.kpi2{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:13px;box-shadow:var(--sh)}
.kpi2 .l{font-size:11px;color:var(--txt2)}
.kpi2 .v{font-family:'Cairo';font-size:22px;margin-top:2px}
.kpi2 .v.ok{color:var(--ok)}.kpi2 .v.warn{color:var(--warn)}

.sec-t{display:flex;align-items:center;justify-content:space-between;margin:20px 0 11px}
.sec-t h3{font-size:14.5px}
.sec-t span{font-size:11px;color:var(--txt3)}

.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:11px;padding:12px 13px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .av{width:36px;height:36px;border-radius:11px;background:var(--ac-l);color:var(--ac);
  display:grid;place-items:center;font-family:'Cairo';font-size:13px;flex:0 0 auto}
.row .n{font-weight:700;font-size:13.5px}
.row .s{font-size:11.5px;color:var(--txt2)}
.row .end{margin-inline-start:auto;text-align:end;flex:0 0 auto}

.bdg{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px}
.b-trial{background:rgba(240,169,59,.15);color:var(--warn)}
.b-active{background:rgba(23,199,135,.15);color:var(--ok)}
.b-pending{background:rgba(95,212,232,.15);color:var(--ac)}
.b-grace{background:rgba(232,93,82,.15);color:var(--danger)}

.btn2{display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 14px;
  border-radius:11px;font-family:'Cairo';font-weight:700;font-size:12.5px;transition:.15s}
.btn2:active{transform:scale(.96)}
.btn-p2{background:var(--ac);color:#04191F}

.alert{display:flex;gap:11px;padding:13px 14px;border-radius:14px;margin-bottom:10px;font-size:12.5px}
.alert.warn{background:rgba(240,169,59,.1);border:1px solid rgba(240,169,59,.25);color:#F5C880}
.alert.info{background:rgba(95,212,232,.08);border:1px solid rgba(95,212,232,.22);color:#A8E8F2}

.flag-row{display:flex;align-items:center;gap:11px;padding:13px;border-bottom:1px solid var(--line)}
.flag-row:last-child{border-bottom:0}
.flag-row .n{font-weight:600;font-size:13px;flex:1}
.flag-row .s{font-size:11px;color:var(--txt2);display:block;margin-top:2px}
.sw{width:44px;height:26px;border-radius:20px;background:var(--line2);position:relative;transition:.3s;flex:0 0 auto}
.sw i{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.3s;font-style:normal}
.sw.on{background:var(--ok)}
.sw.on i{transform:translateX(-18px)}

.nav{position:absolute;inset-inline:0;bottom:0;height:var(--nav);background:rgba(16,18,24,.97);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;z-index:40}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--txt3);font-size:10px;font-weight:600;position:relative}
.nav button[aria-pressed="true"]{color:var(--ac)}
.nav .i{font-size:18px}
.nav .bn{position:absolute;top:6px;inset-inline-end:calc(50% - 18px);background:var(--danger);color:#fff;
  font-size:9px;min-width:15px;height:15px;border-radius:8px;display:grid;place-items:center;font-weight:700}

.egypt{display:grid;grid-template-columns:repeat(22,1fr);gap:4px;padding:14px}
.egypt i{aspect-ratio:1;border-radius:2px;background:var(--line);font-style:normal}
.egypt i.on{background:var(--ac)}

.toast{position:absolute;bottom:calc(var(--nav) + 16px);inset-inline:15px;background:#1A1E28;color:#fff;
  padding:12px 15px;border-radius:13px;font-size:12.5px;z-index:60;
  transform:translateY(20px);opacity:0;transition:.3s;pointer-events:none;text-align:center;border:1px solid var(--line)}
.toast.show{transform:none;opacity:1}
.mt{margin-top:12px}.mb{margin-bottom:12px}.muted{color:var(--txt2)}.tiny{font-size:11.5px}
</style></head>
<body>
<div class="app" id="app">

  <div id="boot"><div class="in">
    <svg class="mk" viewBox="0 0 64 64"><rect width="64" height="64" rx="19" fill="#12242A"/>
      <path d="M16 46 L26 46 L26 36 L38 36 L38 25 L49 25" fill="none" stroke="#5FD4E8" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="49" cy="25" r="4.6" fill="#17C787"/></svg>
    <b>بسيطة</b><span>لوحة المالك</span><div class="bar"><i></i></div></div></div>

  <div id="loginFlow">
    <div class="spacer" style="flex:.4"></div>
    <svg class="lmark" viewBox="0 0 76 76"><circle cx="38" cy="38" r="38" fill="#12242A"/>
      <path d="M38 24 L46 44 L30 44 Z" fill="none" stroke="#5FD4E8" stroke-width="2.6" stroke-linejoin="round"/>
      <circle cx="38" cy="52" r="3" fill="#5FD4E8"/></svg>
    <h1 class="ltitle">دخول المالك</h1>
    <p class="lsub">الوصول ده خاص بيك انت بس — صاحب المنصة</p>
    <div class="fld mt"><label>رمز الدخول</label>
      <input id="pinInput" type="password" maxlength="4" inputmode="numeric" placeholder="••••"></div>
    <div class="demo-hint">🔑 رمز التجربة: <b class="num">1234</b></div>
    <div class="spacer"></div>
    <button class="btn btn-p" onclick="doLogin()">دخول</button>
  </div>

  <div id="mainApp">
    <div class="top">
      <div class="top-r">
        <svg class="mark" viewBox="0 0 32 32"><rect width="32" height="32" rx="10" fill="#12242A"/>
          <path d="M8 23 L14 23 L14 17 L20 17 L20 11 L25 11" fill="none" stroke="#5FD4E8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="25" cy="11" r="3" fill="#17C787"/></svg>
        <div class="brand"><b>بسيطة</b><span>لوحة المالك</span></div>
        <button class="live" style="border:0;background:rgba(255,255,255,.06);border-radius:9px;padding:5px 9px;margin-inline-start:auto;cursor:pointer" onclick="openOwnerSettings()">⚙️ الإعدادات</button>
      </div>
      <div class="role-tag">👁️ غرفة القيادة — <b>إبراهيم غانم</b></div>
    </div>
    <div class="body" id="screen"></div>
    <div class="nav" id="nav"></div>
    <div class="toast" id="toast"></div>
  </div>
</div>

<script>
const ROLE='owner';
const bc=('BroadcastChannel' in window)?new BroadcastChannel('basita_sync'):null;
function emit(msg){
  msg.__basita=true; msg.from=ROLE; msg.ts=Date.now(); msg.id=msg.id||Math.random().toString(36).slice(2);
  try{ if(window.parent!==window) window.parent.postMessage(msg,'*'); }catch(e){}
  try{ bc&&bc.postMessage(msg); }catch(e){}
  try{ localStorage.setItem('basita_bus', JSON.stringify(msg)); }catch(e){}
}
function onBus(fn){
  window.addEventListener('message', e=>{ if(e.data&&e.data.__basita&&e.data.from!==ROLE) fn(e.data) });
  if(bc) bc.onmessage=e=>{ if(e.data&&e.data.from!==ROLE) fn(e.data) };
  window.addEventListener('storage', e=>{ if(e.key==='basita_bus'&&e.newValue){
    try{const d=JSON.parse(e.newValue); if(d.from!==ROLE) fn(d)}catch(_){} }});
}

setTimeout(()=>document.getElementById('boot').classList.add('gone'),1300);
setTimeout(()=>document.getElementById('loginFlow').classList.add('show'),1350);

function doLogin(){
  const v=document.getElementById('pinInput').value.trim();
  if(v!==S.pin){toast('الرمز غلط — جرّب 1234');return}
  document.getElementById('loginFlow').classList.remove('show');
  setTimeout(()=>{document.getElementById('mainApp').classList.add('show');render()},350);
}
function toast(m){const t=document.getElementById('toast');if(!t)return;t.textContent=m;t.classList.add('show');
  clearTimeout(window._tT);window._tT=setTimeout(()=>t.classList.remove('show'),2600)}

let S={view:'overview',
  merchants:[
    {id:'m1',name:'ماركت أبو حمزة',type:'بقالة',icon:'🛒',status:'trial',daysLeft:14,price:99,slaBreaches:0},
  ],
  events:[],
  pin:'1234',
  flags:[
    {n:'رسوم التوصيل في المنيل',s:'مفعّلة — ٥ جنيه لكل طلب',on:true},
    {n:'الدفع الإلكتروني',s:'قيد الإعداد — لسه مقفول للكل',on:false},
    {n:'صيدلية الشفاء أونلاين',s:'مقفول لحد المراجعة القانونية',on:false},
  ]};
const $=s=>document.querySelector(s);
const M=n=>Math.round(n).toLocaleString('en');

onBus(d=>{
  if(!d.to||!d.to.includes('owner'))return;
  if(d.type==='subscription:renew_request'){
    const m=S.merchants.find(x=>x.id===d.merchantId);
    if(m){m.status='pending';m.pendingAmount=d.amount;m.name=d.merchantName;}
    S.events.unshift({t:'طلب تجديد من '+d.merchantName,at:'الآن'});
    toast('📩 طلب تجديد اشتراك وصل — '+d.merchantName);
  }
  if(d.type==='ticket:closed'){
    S.events.unshift({t:'🔒 اتقفلت تذكرة الطلب '+d.orderId+' تلقائيًا بعد التسليم',at:'الآن'});
  }
  if(d.type==='merchant:online'){
    const m=S.merchants.find(x=>x.id===d.merchantId);
    if(m){m.name=d.merchantName;m.type=d.bizLabel;m.icon=d.bizIcon;}
    S.events.unshift({t:d.merchantName+' ('+d.bizLabel+') دخل متجره',at:'الآن'});
  }
  if(d.type==='sla:breach'){
    const m=S.merchants.find(x=>x.name===d.merchantName)||S.merchants[0];
    if(m)m.slaBreaches=(m.slaBreaches||0)+1;
    S.events.unshift({t:'⏰ '+d.merchantName+' اتأخر في الرد على طلب '+d.orderId,at:'الآن'});
    toast('⏰ تنبيه: '+d.merchantName+' اتأخر في الرد');
  }
  render();
});
function confirmRenewal(id){
  const m=S.merchants.find(x=>x.id===id);
  m.status='active'; m.daysLeft=30;
  emit({to:['merchant'],type:'subscription:confirmed',merchantId:id});
  S.events.unshift({t:'اتأكد تجديد '+m.name,at:'الآن'});
  render(); toast('اتبعت تأكيد التجديد للتاجر فورًا');
}
function toggleFlag(i){ S.flags[i].on=!S.flags[i].on; render(); toast('اتحدّث الإعداد — بيوصل لكل التطبيقات فورًا'); }
function openOwnerSettings(){
  const el=document.createElement('div'); el.id='oSheetWrap';
  el.innerHTML=`<div style="position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:70" onclick="closeOwnerSettings()"></div>
  <div style="position:absolute;inset-inline:0;bottom:0;background:var(--surf);border:1px solid var(--line);border-radius:22px 22px 0 0;z-index:71;
    max-height:80%;overflow-y:auto;padding:20px 18px 26px">
    <div style="display:flex;align-items:center;margin-bottom:14px">
      <h3 style="font-family:Cairo;font-size:16px">تغيير رمز الدخول</h3>
      <button style="margin-inline-start:auto;width:32px;height:32px;border-radius:10px;background:var(--surf2);font-size:16px;color:var(--txt)" onclick="closeOwnerSettings()">✕</button></div>
    <div class="fld"><label>الرمز الحالي</label><input id="opOld" type="password" maxlength="4" inputmode="numeric" placeholder="••••"></div>
    <div class="fld"><label>الرمز الجديد</label><input id="opNew" type="password" maxlength="4" inputmode="numeric" placeholder="••••"></div>
    <div class="fld"><label>تأكيد الرمز</label><input id="opConf" type="password" maxlength="4" inputmode="numeric" placeholder="••••"></div>
    <button class="btn2 btn-p2" style="width:100%" onclick="saveOwnerPin()">حفظ</button>
  </div>`;
  document.getElementById('app').appendChild(el);
}
function closeOwnerSettings(){ document.getElementById('oSheetWrap')?.remove(); }
function saveOwnerPin(){
  const o=document.getElementById('opOld').value,n=document.getElementById('opNew').value,c=document.getElementById('opConf').value;
  if(o!==S.pin){toast('الرمز الحالي غلط');return}
  if(n.length!==4){toast('الرمز لازم ٤ أرقام');return}
  if(n!==c){toast('الرمز الجديد مش متطابق مع التأكيد');return}
  S.pin=n; closeOwnerSettings(); toast('اتغيّر رمزك بنجاح ✓');
}

function vOverview(){
  const mrr=S.merchants.filter(m=>m.status==='active').reduce((s,m)=>s+m.price,0);
  const trialCount=S.merchants.filter(m=>m.status==='trial').length;
  return `<div class="pad" style="padding-top:14px">
    <div class="sec-t" style="margin-top:0"><h3>الإيراد الشهري (MRR)</h3></div>
    <div class="card" style="padding:18px;text-align:center">
      <div class="kufi num" style="font-size:32px;color:var(--ac)">${M(mrr)} ج</div>
      <div class="tiny muted mt">من ${S.merchants.filter(m=>m.status==='active').length} تاجر مشترك فعليًا</div>
    </div>
    <div class="alert warn mt">⏰ <span>${trialCount} تاجر لسه في فترة التجربة المجانية — تابعهم قبل ما تخلص</span></div>
    <div class="sec-t"><h3>آخر الأحداث</h3></div>
    <div class="card">
      ${S.events.length?S.events.slice(0,6).map(e=>`<div class="row"><span class="av">•</span>
        <span><span class="n">${e.t}</span><span class="s">${e.at}</span></span></div>`).join(''):
        `<div class="row"><span class="s muted" style="padding:8px 0">مفيش أحداث لسه — استنى طلب تجديد من تطبيق التاجر</span></div>`}
    </div>
    <div style="height:14px"></div></div>`;
}
function vMerchants(){
  return `<div class="pad" style="padding-top:14px">
    <div class="card">${S.merchants.map(m=>{
      const badge={trial:'b-trial',active:'b-active',pending:'b-pending',grace:'b-grace'}[m.status];
      const label={trial:`تجربة — ${m.daysLeft} يوم`,active:'مشترك',pending:'بانتظار تأكيدك',grace:'اشتراك خلص'}[m.status];
      return `<div class="row">
        <span class="av">${m.icon||m.name[0]}</span>
        <span style="flex:1"><span class="n">${m.name}</span><span class="s">${m.type} · ${m.price} ج/شهر
          ${m.slaBreaches?` · <span style="color:var(--danger)">⏰ تأخر ${m.slaBreaches} مرة</span>`:''}</span></span>
        <span class="end">
          <span class="bdg ${badge}" style="display:block;margin-bottom:6px">${label}</span>
          ${m.status==='pending'?`<button class="btn2 btn-p2" onclick="confirmRenewal('${m.id}')">تأكيد التجديد</button>`:''}
        </span></div>`}).join('')}
    </div>
    <div class="sec-t"><h3>وضع "شوف بعينه"</h3></div>
    <div class="card" style="padding:14px">
      <div class="tiny muted">تقدر تدخل تشوف أي متجر بالظبط زي ما التاجر شايفه، من غير ما تاخد باسوورده — للدعم الفني السريع.</div>
      <button class="btn2 btn-p2 mt" style="width:100%" onclick="toast('هتفتح لوحة ماركت أبو حمزة زي ما التاجر شايفها بالظبط')">افتح كـ ماركت أبو حمزة</button>
    </div>
    <div style="height:14px"></div></div>`;
}
function vFlags(){
  return `<div class="pad" style="padding-top:14px">
    <div class="alert info mb">💡 <span>تقدر تشغّل أو توقف أي ميزة فورًا من غير تحديث للتطبيق</span></div>
    <div class="card">${S.flags.map((f,i)=>`<div class="flag-row">
      <span class="n">${f.n}<span class="s">${f.s}</span></span>
      <div class="sw ${f.on?'on':''}" onclick="toggleFlag(${i})"><i></i></div></div>`).join('')}</div>
    <div style="height:14px"></div></div>`;
}
function vMap(){
  const N=22*7;
  const lit=new Set();
  while(lit.size<26) lit.add(Math.floor(Math.random()*N));
  return `<div class="pad" style="padding-top:14px">
    <div class="card"><div class="egypt">${Array.from({length:N},(_,i)=>`<i class="${lit.has(i)?'on':''}"></i>`).join('')}</div></div>
    <div class="card mt" style="padding:14px">
      <div class="row" style="padding:6px 0;border:0"><span class="n">قرى نشطة</span><b class="num end">1</b></div>
      <div class="row" style="padding:6px 0;border:0"><span class="n">محلات مفعّلة</span><b class="num end">1</b></div>
      <div class="row" style="padding:6px 0;border:0"><span class="n">مناديب متاحين</span><b class="num end ok" style="color:var(--ok)">1</b></div>
    </div>
    <div class="alert info mt">🗺️ الهيكل الجغرافي جدول واحد ذاتي المرجعية — إضافة قرية جديدة صف واحد بس، من غير أي تعديل في الكود.</div>
    <div style="height:14px"></div></div>`;
}
const V={overview:vOverview,merchants:vMerchants,flags:vFlags,map:vMap};
const NAV=[['overview','📊','نظرة عامة'],['merchants','🏪','التجّار'],['flags','🎛️','الإعدادات'],['map','🗺️','الخريطة']];
function render(){
  const pending=S.merchants.filter(m=>m.status==='pending').length;
  $('#kpis2')?.remove();
  const kp=document.createElement('div'); kp.className='kpis2'; kp.id='kpis2';
  kp.innerHTML=`<div class="kpi2"><div class="l">تجّار نشطين</div><div class="v num">${S.merchants.length}</div></div>
    <div class="kpi2"><div class="l">طلبات تجديد</div><div class="v ${pending?'warn':'ok'} num">${pending}</div></div>`;
  const top=document.querySelector('.top'); top.insertAdjacentElement('afterend',kp);
  $('#screen').innerHTML=(V[S.view]||vOverview)();
  $('#nav').innerHTML=NAV.map(([v,i,n])=>{
    const bn=(v==='merchants'&&pending)?`<span class="bn num">${pending}</span>`:'';
    return `<button aria-pressed="${S.view===v}" onclick="S.view='${v}';render()">
      ${bn}<span class="i">${i}</span><span>${n}</span></button>`}).join('');
}
</script>
</body></html>
