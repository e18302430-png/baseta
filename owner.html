<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>بسيطة · لوحة المالك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08090D;--surf:#101218;--surf2:#171A22;--line:#20242F;--line2:#2C313F;
  --txt:#F2F4F8;--txt2:#848DA3;--txt3:#4E5567;
  --ac:#5FD4E8;--ac-d:#2FA9C0;--ac-l:#12242A;
  --ok:#17C787;--warn:#F0A93B;--danger:#E85D52;--r:18px;--nav:66px;
  --sh:0 8px 24px -10px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font-family:'IBM Plex Sans Arabic',sans-serif;font-size:14.5px;
  display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
h1,h2,h3,.kufi{font-family:'Cairo';font-weight:800;margin:0;letter-spacing:-.3px}
.num{font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font-family:inherit;font-size:16px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

.app{width:100%;max-width:412px;height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}

#boot{position:absolute;inset:0;z-index:200;background:radial-gradient(circle at 50% 30%,#0F2229,#08090D 70%);
  display:grid;place-items:center;transition:opacity .6s ease,visibility .6s}
#boot.gone{opacity:0;visibility:hidden;pointer-events:none}
#boot .in{text-align:center}
#boot .mk{width:64px;height:64px;margin:0 auto 16px;animation:bootIn .8s cubic-bezier(.2,.8,.2,1)}
@keyframes bootIn{from{opacity:0;transform:scale(.7) rotate(-10deg)}}
#boot b{font-family:'Cairo';color:#fff;font-size:19px;letter-spacing:2px;display:block}
#boot span{color:var(--ac);font-size:10.5px;letter-spacing:3px;font-weight:600}
#boot .bar{width:130px;height:3px;background:rgba(255,255,255,.1);border-radius:9px;margin:20px auto 0;overflow:hidden}
#boot .bar i{display:block;height:100%;width:0;background:var(--ac);animation:ld 1.3s ease forwards;border-radius:9px}
@keyframes ld{to{width:100%}}
#boot .mk path{stroke-dasharray:90;stroke-dashoffset:90;animation:drawPath 850ms cubic-bezier(.2,.8,.2,1) forwards}
#boot .mk circle{opacity:0;transform:scale(.3);transform-box:fill-box;transform-origin:center;
  animation:popIn 480ms cubic-bezier(.34,1.56,.64,1) 650ms forwards}
@keyframes drawPath{to{stroke-dashoffset:0}}
@keyframes popIn{to{opacity:1;transform:scale(1)}}
#boot b{display:inline-block;position:relative;overflow:hidden;
  clip-path:inset(0 100% 0 0);animation:reveal 650ms cubic-bezier(.2,.8,.2,1) 480ms forwards}
@keyframes reveal{to{clip-path:inset(0 0 0 0)}}
#boot b::after{content:"";position:absolute;inset:0;mix-blend-mode:overlay;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
  background-size:220% 100%;background-position:200% 0;animation:sheenSweep 850ms ease 900ms forwards}
@keyframes sheenSweep{to{background-position:-120% 0}}
#boot span{display:block;opacity:0;transform:translateY(7px);animation:fadeUp 480ms ease 1050ms forwards}
@keyframes fadeUp{to{opacity:1;transform:none}}

#loginFlow{position:absolute;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;
  padding:32px 26px;opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s ease;pointer-events:none}
#loginFlow.show{opacity:1;transform:none;pointer-events:auto}
.spacer{flex:1}
.lmark{width:76px;height:76px;margin:0 auto 20px}
h1.ltitle{font-size:22px;text-align:center}
p.lsub{color:var(--txt2);text-align:center;margin:9px 0 0;font-size:13px;line-height:1.7}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12.5px;font-weight:600;margin-bottom:7px;color:var(--txt2)}
.fld input{width:100%;padding:15px;border:1.5px solid var(--line);border-radius:14px;
  background:var(--surf2);color:var(--txt);outline:0;transition:.2s;text-align:center;letter-spacing:6px;font-family:'Cairo'}
.fld input:focus{border-color:var(--ac)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;
  border-radius:15px;font-family:'Cairo';font-weight:700;font-size:15px;transition:.15s}
.btn:active{transform:scale(.98)}
.btn-p{background:var(--ac);color:#04191F;box-shadow:0 10px 26px -10px rgba(95,212,232,.4)}
.demo-hint{background:var(--ac-l);color:var(--ac);border-radius:12px;padding:11px 14px;font-size:12.5px;
  text-align:center;margin-top:12px;border:1px dashed rgba(95,212,232,.3)}

#mainApp{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;transition:opacity .5s ease .1s}
#mainApp.show{opacity:1}
.top{padding:14px 16px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;
  background:rgba(8,9,13,.92);backdrop-filter:blur(14px)}
.top-r{display:flex;align-items:center;gap:10px}
.mark{width:30px;height:30px;flex:0 0 auto}
.brand b{font-family:'Cairo';font-size:15px;display:block;line-height:1.1}
.brand span{font-size:9px;color:var(--ac);letter-spacing:1.6px;font-weight:600}
.live{margin-inline-start:auto;display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--txt3)}
.live i{width:6px;height:6px;border-radius:50%;background:var(--ac);animation:pu 2s infinite;display:block}
@keyframes pu{0%,100%{box-shadow:0 0 0 0 rgba(95,212,232,.5)}50%{box-shadow:0 0 0 5px rgba(95,212,232,0)}}
.role-tag{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--txt2);margin-top:10px}
.role-tag b{color:var(--txt)}

.body{flex:1;overflow-y:auto;padding-bottom:calc(var(--nav) + 12px)}
.body::-webkit-scrollbar{width:0}
.pad{padding:0 16px}

.kpis2{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:14px 16px 0}
.kpi2{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:13px;box-shadow:var(--sh)}
.kpi2 .l{font-size:11px;color:var(--txt2)}
.kpi2 .v{font-family:'Cairo';font-size:22px;margin-top:2px}
.kpi2 .v.ok{color:var(--ok)}.kpi2 .v.warn{color:var(--warn)}

.sec-t{display:flex;align-items:center;justify-content:space-between;margin:20px 0 11px}
.sec-t h3{font-size:14.5px}
.sec-t span{font-size:11px;color:var(--txt3)}

.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:11px;padding:12px 13px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .av{width:36px;height:36px;border-radius:11px;background:var(--ac-l);color:var(--ac);
  display:grid;place-items:center;font-family:'Cairo';font-size:13px;flex:0 0 auto}
.row .n{font-weight:700;font-size:13.5px}
.row .s{font-size:11.5px;color:var(--txt2)}
.row .end{margin-inline-start:auto;text-align:end;flex:0 0 auto}

.bdg{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px}
.b-trial{background:rgba(240,169,59,.15);color:var(--warn)}
.b-active{background:rgba(23,199,135,.15);color:var(--ok)}
.b-pending{background:rgba(95,212,232,.15);color:var(--ac)}
.b-danger{background:rgba(232,93,82,.15);color:var(--danger)}
.b-grace{background:rgba(232,93,82,.15);color:var(--danger)}

.btn2{display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 14px;
  border-radius:11px;font-family:'Cairo';font-weight:700;font-size:12.5px;transition:.15s}
.btn2:active{transform:scale(.96)}
.btn-p2{background:var(--ac);color:#04191F}

.alert{display:flex;gap:11px;padding:13px 14px;border-radius:14px;margin-bottom:10px;font-size:12.5px}
.alert.warn{background:rgba(240,169,59,.1);border:1px solid rgba(240,169,59,.25);color:#F5C880}
.alert.info{background:rgba(95,212,232,.08);border:1px solid rgba(95,212,232,.22);color:#A8E8F2}

.flag-row{display:flex;align-items:center;gap:11px;padding:13px;border-bottom:1px solid var(--line)}
.flag-row:last-child{border-bottom:0}
.flag-row .n{font-weight:600;font-size:13px;flex:1}
.flag-row .s{font-size:11px;color:var(--txt2);display:block;margin-top:2px}
.sw{width:44px;height:26px;border-radius:20px;background:var(--line2);position:relative;transition:.3s;flex:0 0 auto}
.sw i{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.3s;font-style:normal}
.sw.on{background:var(--ok)}
.sw.on i{transform:translateX(-18px)}

.nav{position:absolute;inset-inline:0;bottom:0;height:var(--nav);background:rgba(16,18,24,.97);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;z-index:40;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:0 0 auto;min-width:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--txt3);font-size:10px;font-weight:600;position:relative;padding:0 6px}
.nav button[aria-pressed="true"]{color:var(--ac)}
.nav .i{font-size:18px}
.nav .bn{position:absolute;top:6px;inset-inline-end:calc(50% - 18px);background:var(--danger);color:#fff;
  font-size:9px;min-width:15px;height:15px;border-radius:8px;display:grid;place-items:center;font-weight:700}

.egypt{display:grid;grid-template-columns:repeat(22,1fr);gap:4px;padding:14px}
.egypt i{aspect-ratio:1;border-radius:2px;background:var(--line);font-style:normal}
.egypt i.on{background:var(--ac)}

.toast{position:absolute;bottom:calc(var(--nav) + 16px);inset-inline:15px;background:#1A1E28;color:#fff;
  padding:12px 15px;border-radius:13px;font-size:12.5px;z-index:60;
  transform:translateY(20px);opacity:0;transition:.3s;pointer-events:none;text-align:center;border:1px solid var(--line)}
.toast.show{transform:none;opacity:1}
.mt{margin-top:12px}.mb{margin-bottom:12px}.muted{color:var(--txt2)}.tiny{font-size:11.5px}
</style></head>
<body>
<div class="app" id="app">

  <div id="boot"><div class="in">
    <svg class="mk" viewBox="0 0 64 64"><rect width="64" height="64" rx="19" fill="#12242A"/>
      <path d="M16 46 L26 46 L26 36 L38 36 L38 25 L49 25" fill="none" stroke="#5FD4E8" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="49" cy="25" r="4.6" fill="#17C787"/></svg>
    <b>بسيطة</b><span>لوحة المالك</span><div class="bar"><i></i></div></div></div>

  <div id="loginFlow">
    <div class="spacer" style="flex:.4"></div>
    <svg class="lmark" viewBox="0 0 76 76"><circle cx="38" cy="38" r="38" fill="#12242A"/>
      <path d="M38 24 L46 44 L30 44 Z" fill="none" stroke="#5FD4E8" stroke-width="2.6" stroke-linejoin="round"/>
      <circle cx="38" cy="52" r="3" fill="#5FD4E8"/></svg>
    <h1 class="ltitle">دخول المالك</h1>
    <p class="lsub">الوصول ده خاص بيك انت بس — صاحب المنصة</p>
    <div class="fld mt"><label>رمز الدخول</label>
      <input id="pinInput" type="password" maxlength="4" inputmode="numeric" placeholder="••••"></div>
    <div class="spacer"></div>
    <button class="btn btn-p" onclick="doLogin()">دخول</button>
  </div>

  <div id="mainApp">
    <div class="top">
      <div class="top-r">
        <svg class="mark" viewBox="0 0 32 32"><rect width="32" height="32" rx="10" fill="#12242A"/>
          <path d="M8 23 L14 23 L14 17 L20 17 L20 11 L25 11" fill="none" stroke="#5FD4E8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="25" cy="11" r="3" fill="#17C787"/></svg>
        <div class="brand"><b>بسيطة</b><span>لوحة المالك</span></div>
        <button class="live" style="border:0;background:rgba(255,255,255,.06);border-radius:9px;padding:5px 9px;margin-inline-start:auto;cursor:pointer" onclick="openOwnerSettings()">⚙️ الإعدادات</button>
      </div>
      <div class="role-tag">👁️ غرفة القيادة — <b>إبراهيم غانم</b></div>
    </div>
    <div class="body" id="screen"></div>
    <div class="nav" id="nav"></div>
    <div class="toast" id="toast"></div>
  </div>
</div>

<script>
const ROLE='owner';
const bc=('BroadcastChannel' in window)?new BroadcastChannel('basita_sync'):null;
function emit(msg){
  msg.__basita=true; msg.from=ROLE; msg.ts=Date.now(); msg.id=msg.id||Math.random().toString(36).slice(2);
  try{ if(window.parent!==window) window.parent.postMessage(msg,'*'); }catch(e){}
  try{ bc&&bc.postMessage(msg); }catch(e){}
  try{ localStorage.setItem('basita_bus', JSON.stringify(msg)); }catch(e){}
}
const _seenMsgIds=new Set();
function _dedupe(fn){
  return d=>{
    if(!d||!d.id||_seenMsgIds.has(d.id))return;
    _seenMsgIds.add(d.id);
    if(_seenMsgIds.size>300){ _seenMsgIds.delete(_seenMsgIds.values().next().value); }
    fn(d);
  };
}
function onBus(fn){
  const wrapped=_dedupe(fn);
  window.addEventListener('message', e=>{ if(e.data&&e.data.__basita&&e.data.from!==ROLE) wrapped(e.data) });
  if(bc) bc.onmessage=e=>{ if(e.data&&e.data.from!==ROLE) wrapped(e.data) };
  window.addEventListener('storage', e=>{ if(e.key==='basita_bus'&&e.newValue){
    try{const d=JSON.parse(e.newValue); if(d.from!==ROLE) wrapped(d)}catch(_){} }});
}

setTimeout(()=>document.getElementById('boot').classList.add('gone'),1300);
setTimeout(()=>document.getElementById('loginFlow').classList.add('show'),1350);

function doLogin(){
  const v=document.getElementById('pinInput').value.trim();
  if(v!==S.pin){toast('الرمز غلط');return}
  document.getElementById('loginFlow').classList.remove('show');
  setTimeout(()=>{
    document.getElementById('mainApp').classList.add('show');render();
    emit({to:['merchant'],type:'vodafone:number_updated',number:S.vodafoneCash});
    if('Notification' in window && Notification.permission==='default') Notification.requestPermission();
  },350);
}
function pushNotify(m){
  try{
    if('Notification' in window && Notification.permission==='granted' && document.hidden){
      new Notification('بسيطة · لوحة المالك',{body:m,icon:''});
    }
  }catch(e){}
}
function playNotifySound(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    [0,.16].forEach(delay=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.type='sine';o.frequency.value=740;
      const t0=ctx.currentTime+delay;
      g.gain.setValueAtTime(.0001,t0);
      g.gain.exponentialRampToValueAtTime(.16,t0+.01);
      g.gain.exponentialRampToValueAtTime(.0001,t0+.22);
      o.start(t0);o.stop(t0+.24);
    });
  }catch(e){}
}
function toast(m){playNotifySound();pushNotify(m);const t=document.getElementById('toast');if(!t)return;t.textContent=m;t.classList.add('show');
  clearTimeout(window._tT);window._tT=setTimeout(()=>t.classList.remove('show'),2600)}

let S={view:'overview',
  merchants:[],
  customers:[],
  events:[],
  tickets:[],
  tips:[],
  driverApplications:[],
  membersTab:'customers',
  vodafoneCash:'01001234567',
  pin:'1234',
  flags:[
    {n:'رسوم التوصيل في المنيل',s:'مفعّلة — ٥ جنيه لكل طلب',on:true},
    {n:'الدفع الإلكتروني',s:'قيد الإعداد — لسه مقفول للكل',on:false},
    {n:'صيدلية الشفاء أونلاين',s:'مقفول لحد المراجعة القانونية',on:false},
  ]};
const $=s=>document.querySelector(s);
const M=n=>Math.round(n).toLocaleString('en');

onBus(d=>{
  if(d.type==='customer:register'){
    if(!S.customers.find(c=>c.customerId===d.customerId)){
      S.customers.unshift({customerId:d.customerId,name:d.name,phone:d.phone,landmark:d.landmark,
        at:new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}),orders:0,spent:0});
      S.events.unshift({t:'👤 عميل جديد انضم للمنصة — '+d.name,at:'الآن'});
      render();
    }
    return;
  }
  if(d.type==='order:new'){
    const c=S.customers.find(c=>c.customerId===d.order?.customerId);
    if(c){ c.orders=(c.orders||0)+1; c.spent=(c.spent||0)+(d.order.total||0); }
  }
  if(d.type==='order:status'&&d.status==='delivered'){
    const m=S.merchants.find(m=>m.id===d.merchantId);
    if(m){ m.salesTotal=(m.salesTotal||0)+(d.total||0); m.ordersDelivered=(m.ordersDelivered||0)+1; }
    if(d.driverId){
      const a=S.driverApplications.find(a=>a.driverId===d.driverId);
      if(a){ a.deliveries=(a.deliveries||0)+1; a.earnings=(a.earnings||0)+(d.total||0); }
    }
    render();
  }
  if(d.type==='driver:register'){
    S.driverApplications.unshift({driverId:d.driverId,driverName:d.driverName,vehicle:d.vehicle,phone:d.phone,
      idCardPhoto:d.idCardPhoto,selfiePhoto:d.selfiePhoto,status:'pending',at:new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})});
    S.events.unshift({t:'🛵 مندوب جديد سجّل وبانتظار المراجعة — '+d.driverName,at:'الآن'});
    toast('🔒 مندوب جديد محتاج مراجعة هوية — '+d.driverName);
    render(); return;
  }
  if(d.type==='support:ticket'){
    S.tickets.unshift({...d,status:'open',replies:[],at:new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})});
    toast('🆘 تذكرة دعم جديدة من '+d.roleName+' — '+d.fromName);
    render(); return;
  }
  if(d.type==='support:confirm_resolved'){
    const t=S.tickets.find(x=>x.ticketId===d.ticketId);
    if(t){ t.status='resolved'; S.events.unshift({t:'✅ '+t.roleName+' ('+t.fromName+') أكّد إن تذكرة الدعم اتحلّت',at:'الآن'}); toast('✅ '+t.roleName+' أكّد حل التذكرة'); render(); }
    return;
  }
  if(d.type==='support:not_resolved'){
    const t=S.tickets.find(x=>x.ticketId===d.ticketId);
    if(t){ t.status='reopened'; if(d.note){t.replies=t.replies||[]; t.replies.push({from:t.role,text:d.note,at:new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})});} S.events.unshift({t:'⚠️ '+t.roleName+' ('+t.fromName+') قال إن المشكلة لسه مش اتحلت',at:'الآن'}); toast('⚠️ التذكرة اتفتحت تاني — المشكلة لسه موجودة'); render(); }
    return;
  }
  if(d.type==='tip:sent'){
    S.tips.unshift({orderId:d.orderId,amount:d.amount,driverName:d.driverName,customerName:d.customerName,status:'pending',
      at:new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})});
    S.events.unshift({t:'🎁 إكرامية '+d.amount+' ج من '+d.customerName+' لـ'+d.driverName,at:'الآن'});
    render(); return;
  }
  if(!d.to||!d.to.includes('owner'))return;
  if(d.type==='merchant:signup_request'){
    S.merchants.unshift({id:d.merchantId,name:d.merchantName,type:d.bizLabel,icon:d.bizIcon,phone:d.phone,
      status:'awaiting_approval',daysLeft:0,price:99,slaBreaches:0});
    S.events.unshift({t:'📝 طلب تسجيل متجر جديد — '+d.merchantName,at:'الآن'});
    toast('📝 تسجيل جديد بانتظار موافقتك — '+d.merchantName);
    render(); return;
  }
  if(d.type==='subscription:payment_submitted'){
    const m=S.merchants.find(x=>x.id===d.merchantId);
    if(m){ m.status='payment_review'; m.pendingAmount=d.amount; m.pendingReceipt=d.receipt; }
    S.events.unshift({t:'💳 دفعة جديدة بانتظار المراجعة — '+d.merchantName,at:'الآن'});
    toast('💳 إيصال دفع جديد وصل من '+d.merchantName);
    render(); return;
  }
  if(d.type==='trial:warning'){
    const m=S.merchants.find(x=>x.id===d.merchantId);
    if(m) m.daysLeft=d.daysLeft;
    S.events.unshift({t:'⏰ تجربة '+d.merchantName+' قربت تخلص — باقي '+d.daysLeft+' يوم',at:'الآن'});
  }
  if(d.type==='subscription:renew_request'){
    const m=S.merchants.find(x=>x.id===d.merchantId);
    if(m){m.status='pending';m.pendingAmount=d.amount;m.name=d.merchantName;}
    S.events.unshift({t:'طلب تجديد من '+d.merchantName,at:'الآن'});
    toast('📩 طلب تجديد اشتراك وصل — '+d.merchantName);
  }
  if(d.type==='ticket:closed'){
    S.events.unshift({t:'🔒 اتقفلت تذكرة الطلب '+d.orderId+' تلقائيًا بعد التسليم',at:'الآن'});
  }
  if(d.type==='merchant:online'){
    const m=S.merchants.find(x=>x.id===d.merchantId);
    if(m){m.name=d.merchantName;m.type=d.bizLabel;m.icon=d.bizIcon;}
    S.events.unshift({t:d.merchantName+' ('+d.bizLabel+') دخل متجره',at:'الآن'});
  }
  if(d.type==='sla:breach'){
    const m=S.merchants.find(x=>x.name===d.merchantName)||S.merchants[0];
    if(m)m.slaBreaches=(m.slaBreaches||0)+1;
    S.events.unshift({t:'⏰ '+d.merchantName+' اتأخر في الرد على طلب '+d.orderId,at:'الآن'});
    toast('⏰ تنبيه: '+d.merchantName+' اتأخر في الرد');
  }
  if(d.type==='feedback:submitted'){
    if(d.complaint){
      S.events.unshift({t:'⚠️ شكوى من '+d.customerName+': '+d.complaint,at:'الآن'});
      toast('⚠️ شكوى جديدة وصلت من عميل');
    } else {
      S.events.unshift({t:'⭐ تقييم جديد — المتجر '+d.merchantRating+'/٥ · المندوب '+d.driverRating+'/٥',at:'الآن'});
    }
  }
  render();
});

function exportBackup(){
  const data=JSON.stringify({merchants:S.merchants,events:S.events,flags:S.flags,exportedAt:new Date().toISOString()},null,2);
  const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='basita-backup-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast('اتحمّلت النسخة الاحتياطية ✓');
}
function importBackupFile(input){
  const file=input.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(data.merchants)S.merchants=data.merchants;
      if(data.events)S.events=data.events;
      if(data.flags)S.flags=data.flags;
      render(); toast('اتستعادت النسخة الاحتياطية بنجاح ✓');
    }catch(err){ toast('الملف مش صالح — اتأكد إنه نسخة احتياطية صحيحة'); }
  };
  reader.readAsText(file);
  input.value='';
}
let resetConfirmStep=false, resetConfirmT=null;
function requestReset(){
  if(!resetConfirmStep){
    resetConfirmStep=true; render();
    clearTimeout(resetConfirmT);
    resetConfirmT=setTimeout(()=>{resetConfirmStep=false;render();},6000);
    return;
  }
  clearTimeout(resetConfirmT);
  S.merchants.forEach(m=>{ m.status='trial'; m.daysLeft=14; m.slaBreaches=0; delete m.pendingAmount; });
  S.events=[];
  emit({to:['customer','merchant','driver'],type:'platform:reset'});
  resetConfirmStep=false;
  render(); toast('🗑️ اتصفّرت بيانات الشبكة كلها في كل التطبيقات');
}

function simulateDayPass(){
  emit({to:['merchant'],type:'trial:tick'});
  S.events.unshift({t:'🧪 محاكاة اختبار: يوم افتراضي عدّى على التجار',at:'الآن'});
  render(); toast('🧪 اتحاكى مرور يوم — هتلاقي العدّاد نقص عند التاجر');
}
function vFlags(){
  return `<div class="pad" style="padding-top:14px">
    <div class="sec-t" style="margin-top:0"><h3>تحصيل الاشتراكات</h3></div>
    <div class="card" style="padding:14px">
      <div class="tiny muted mb">رقم فودافون كاش اللي التجار هيحوّلوا عليه اشتراكهم</div>
      <div style="display:flex;gap:8px">
        <input id="vfInput" value="${S.vodafoneCash}" dir="ltr" style="flex:1;padding:12px;border:1px solid var(--line);
          border-radius:11px;background:var(--surf2);color:var(--txt);font-family:'Cairo';text-align:center">
        <button class="btn2 btn-p2" onclick="saveVodafoneNumber()">حفظ</button>
      </div>
    </div>
    <div class="alert info mb mt">💡 <span>تقدر تشغّل أو توقف أي ميزة فورًا من غير تحديث للتطبيق</span></div>
    <div class="card">${S.flags.map((f,i)=>`<div class="flag-row">
      <span class="n">${f.n}<span class="s">${f.s}</span></span>
      <div class="sw ${f.on?'on':''}" onclick="toggleFlag(${i})"><i></i></div></div>`).join('')}</div>
    <div class="sec-t"><h3>🧪 أداة اختبار</h3></div>
    <div class="card" style="padding:14px">
      <div class="tiny muted mb">مفيش سيرفر حقيقي بيعدّ الأيام في النسخة دي — استخدم الزرار ده عشان تجرّب رحلة انتهاء التجربة والاشتراك بنفسك من غير ما تستنى ١٤ يوم فعليًا.</div>
      <button class="btn2 btn-o2" style="width:100%" onclick="simulateDayPass()">⏩ حاكِ مرور يوم واحد على كل التجار</button>
    </div>
    <div style="height:14px"></div></div>`;
}
function vMap(){
  const N=22*7;
  const lit=new Set();
  while(lit.size<26) lit.add(Math.floor(Math.random()*N));
  return `<div class="pad" style="padding-top:14px">
    <div class="card"><div class="egypt">${Array.from({length:N},(_,i)=>`<i class="${lit.has(i)?'on':''}"></i>`).join('')}</div></div>
    <div class="card mt" style="padding:14px">
      <div class="row" style="padding:6px 0;border:0"><span class="n">قرى نشطة</span><b class="num end">1</b></div>
      <div class="row" style="padding:6px 0;border:0"><span class="n">محلات مفعّلة</span><b class="num end">1</b></div>
      <div class="row" style="padding:6px 0;border:0"><span class="n">مناديب متاحين</span><b class="num end ok" style="color:var(--ok)">1</b></div>
    </div>
    <div class="alert info mt">🗺️ الهيكل الجغرافي جدول واحد ذاتي المرجعية — إضافة قرية جديدة صف واحد بس، من غير أي تعديل في الكود.</div>
    <div style="height:14px"></div></div>`;
}
function switchMembersTab(t){ S.membersTab=t; render(); }
function vMembers(){
  const t=S.membersTab||'customers';
  const tabs=[['customers','👤','عملاء',S.customers.length],['merchants','🏪','تجّار',S.merchants.length],
    ['drivers','🛵','مناديب',S.driverApplications.filter(a=>a.status==='approved').length]];
  const tabsHtml=`<div style="display:flex;gap:8px;margin-bottom:14px">${tabs.map(([k,i,n,c])=>
    `<button onclick="switchMembersTab('${k}')" style="flex:1;padding:10px;border-radius:12px;border:1.5px solid ${t===k?'var(--ac)':'var(--line)'};
      background:${t===k?'var(--ac-l)':'transparent'};color:${t===k?'var(--ac-d)':'var(--txt2)'};font-family:Cairo;font-size:12px;font-weight:700">
      ${i} ${n} <span class="num">(${c})</span></button>`).join('')}</div>`;
  let body='';
  if(t==='customers'){
    body=!S.customers.length?`<div class="alert info">👤 لسه مفيش عملاء مسجّلين — أي حد يعمل حساب في تطبيق العميل هيظهر هنا</div>`:
      `<div class="card">${S.customers.map(c=>`<div class="row">
        <span class="av">👤</span><span style="flex:1"><span class="n">${c.name}</span>
        <span class="s" dir="ltr">${c.phone||''} ${c.landmark?'· '+c.landmark:''}</span></span>
        <b class="num end">${c.orders||0} طلب</b></div>`).join('')}</div>`;
  } else if(t==='merchants'){
    body=!S.merchants.length?`<div class="alert info">🏪 لسه مفيش تجّار مسجّلين</div>`:
      `<div class="card">${S.merchants.map(m=>`<div class="row">
        <span class="av">${m.icon||'🏪'}</span><span style="flex:1"><span class="n">${m.name}</span>
        <span class="s">${m.type||''}</span></span><b class="num end">${M(m.salesTotal||0)} ج</b></div>`).join('')}</div>`;
  } else {
    const drivers=S.driverApplications.filter(a=>a.status==='approved');
    body=!drivers.length?`<div class="alert info">🛵 لسه مفيش مناديب موثّقين</div>`:
      `<div class="card">${drivers.map(a=>`<div class="row">
        <span class="av">🛵</span><span style="flex:1"><span class="n">${a.driverName}</span>
        <span class="s" dir="ltr">${a.phone||''}</span></span><b class="num end">${a.deliveries||0} توصيلة</b></div>`).join('')}</div>`;
  }
  return `<div class="pad" style="padding-top:14px">${tabsHtml}${body}<div style="height:14px"></div></div>`;
}
function vAnalytics(){
  const topCustomers=[...S.customers].sort((a,b)=>(b.orders||0)-(a.orders||0)).slice(0,5).filter(c=>c.orders);
  const totalSales=S.merchants.reduce((s,m)=>s+(m.salesTotal||0),0)||1;
  const topMerchants=[...S.merchants].sort((a,b)=>(b.salesTotal||0)-(a.salesTotal||0)).slice(0,5).filter(m=>m.salesTotal);
  const drivers=[...S.driverApplications.filter(a=>a.status==='approved')].sort((a,b)=>(b.deliveries||0)-(a.deliveries||0));
  const topDriver=drivers[0];
  return `<div class="pad" style="padding-top:14px">
    <div class="sec-t" style="margin-top:0"><h3>🏆 الأكتر طلبًا</h3></div>
    ${topCustomers.length?`<div class="card">${topCustomers.map((c,i)=>`<div class="row">
      <span class="av">${['🥇','🥈','🥉','4️⃣','5️⃣'][i]}</span><span style="flex:1"><span class="n">${c.name}</span>
      <span class="s">${M(c.spent||0)} ج إجمالي</span></span><b class="num end">${c.orders} طلب</b></div>`).join('')}</div>`:
      `<div class="alert info">📊 لسه مفيش طلبات كفاية نبني بيها الترتيب</div>`}
    <div class="sec-t"><h3>💰 أعلى نسبة مبيعات</h3></div>
    ${topMerchants.length?`<div class="card">${topMerchants.map(m=>{
        const pct=Math.round((m.salesTotal/totalSales)*100);
        return `<div class="row" style="flex-direction:column;align-items:stretch;gap:6px">
        <div style="display:flex;align-items:center;gap:9px"><span class="av">${m.icon||'🏪'}</span>
          <span style="flex:1"><span class="n">${m.name}</span></span><b class="num end">${pct}%</b></div>
        <div style="height:6px;background:var(--surf2);border-radius:4px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:var(--ac);border-radius:4px"></div></div>
        </div>`;}).join('')}</div>`:
      `<div class="alert info">📊 لسه مفيش مبيعات كفاية نحسب بيها النسب</div>`}
    <div class="sec-t"><h3>🛵 أنشط مندوب</h3></div>
    ${topDriver&&topDriver.deliveries?`<div class="card" style="padding:16px;display:flex;align-items:center;gap:12px">
      <span style="font-size:26px">🏆</span><span style="flex:1"><b>${topDriver.driverName}</b>
      <div class="tiny muted">${topDriver.deliveries} توصيلة مكتملة</div></span>
      <b class="num" style="color:var(--ok)">${M(topDriver.earnings||0)} ج</b></div>`:
      `<div class="alert info">🛵 لسه مفيش توصيلات كفاية نحدد بيها الأنشط</div>`}
    <div style="height:14px"></div></div>`;
}
const V={overview:vOverview,merchants:vMerchants,security:vSecurity,members:vMembers,analytics:vAnalytics,support:vSupport,wallets:vWallets,flags:vFlags,map:vMap,data:vData};
const NAV=[['overview','📊','عامة'],['merchants','🏪','تجّار'],['security','🔒','الأمان'],['members','👥','الأعضاء'],['analytics','📈','تحليلات'],['support','🆘','دعم'],['wallets','🎁','إكراميات'],['flags','🎛️','إعدادات'],['map','🗺️','خريطة'],['data','🗄️','بيانات']];
function render(){
  const pending=S.merchants.filter(m=>['awaiting_approval','payment_review'].includes(m.status)).length;
  const openTix=S.tickets.filter(t=>t.status==='open'||t.status==='reopened').length;
  const pendTips=S.tips.filter(t=>t.status==='pending').length;
  const pendDrivers=S.driverApplications.filter(a=>a.status==='pending').length;
  $('#kpis2')?.remove();
  const kp=document.createElement('div'); kp.className='kpis2'; kp.id='kpis2';
  kp.innerHTML=`<div class="kpi2"><div class="l">تجّار نشطين</div><div class="v num">${S.merchants.length}</div></div>
    <div class="kpi2"><div class="l">تذاكر مفتوحة</div><div class="v ${openTix?'warn':'ok'} num">${openTix}</div></div>`;
  const top=document.querySelector('.top'); top.insertAdjacentElement('afterend',kp);
  $('#screen').innerHTML=(V[S.view]||vOverview)();
  $('#nav').innerHTML=NAV.map(([v,i,n])=>{
    const bn=(v==='merchants'&&pending)?`<span class="bn num">${pending}</span>`:
             (v==='security'&&pendDrivers)?`<span class="bn num">${pendDrivers}</span>`:
             (v==='support'&&openTix)?`<span class="bn num">${openTix}</span>`:
             (v==='wallets'&&pendTips)?`<span class="bn num">${pendTips}</span>`:'';
    return `<button aria-pressed="${S.view===v}" onclick="S.view='${v}';render()">
      ${bn}<span class="i">${i}</span><span>${n}</span></button>`}).join('');
}
function approveDriver(driverId){
  const a=S.driverApplications.find(x=>x.driverId===driverId); if(!a)return;
  a.status='approved';
  emit({to:['driver'],type:'driver:approved',driverId});
  S.events.unshift({t:'✅ اتوافق على المندوب '+a.driverName,at:'الآن'});
  render(); toast('اتوافق على '+a.driverName+' ✓');
}
function rejectDriver(driverId){
  const a=S.driverApplications.find(x=>x.driverId===driverId); if(!a)return;
  const reason=prompt('سبب الرفض (هيتبعت للمندوب):','الصور مش واضحة، حاول تاني بصورة أوضح');
  if(reason===null)return;
  a.status='rejected'; a.reason=reason;
  emit({to:['driver'],type:'driver:rejected',driverId,reason});
  S.events.unshift({t:'❌ اترفض المندوب '+a.driverName,at:'الآن'});
  render(); toast('اترفض '+a.driverName);
}
function vSecurity(){
  const pending=S.driverApplications.filter(a=>a.status==='pending');
  const approved=S.driverApplications.filter(a=>a.status==='approved');
  const rejected=S.driverApplications.filter(a=>a.status==='rejected');
  if(!S.driverApplications.length)return `<div class="pad" style="padding-top:14px">
    <div class="alert info">🔒 لسه مفيش طلبات توثيق مناديب — أي مندوب يسجّل هيظهر هنا فورًا ببطاقته وصورته الشخصية</div></div>`;
  return `<div class="pad" style="padding-top:14px">
    ${pending.length?`<div class="sec-t" style="margin-top:0"><h3>بانتظار المراجعة</h3><span class="num">${pending.length}</span></div>
      ${pending.map(a=>`<div class="card mb" style="padding:14px">
        <div style="display:flex;align-items:center;gap:9px;margin-bottom:11px">
          <span style="font-size:18px">🛵</span><b style="font-size:13.5px">${a.driverName}</b>
          <span class="tiny muted" style="margin-inline-start:auto" dir="ltr">${a.phone||''}</span></div>
        <div style="display:flex;gap:8px;margin-bottom:11px">
          <div style="flex:1"><div class="tiny muted mb">صورة البطاقة</div>
            <img src="${a.idCardPhoto}" style="width:100%;height:100px;object-fit:cover;border-radius:10px;border:1px solid var(--line)"></div>
          <div style="flex:1"><div class="tiny muted mb">الصورة الشخصية</div>
            <img src="${a.selfiePhoto}" style="width:100%;height:100px;object-fit:cover;border-radius:10px;border:1px solid var(--line)"></div>
        </div>
        <div class="tiny muted" style="margin-bottom:11px">وسيلة التوصيل: ${a.vehicle} · ${a.at}</div>
        <div style="display:flex;gap:8px">
          <button class="btn2 btn-p2" style="flex:1" onclick="approveDriver('${a.driverId}')">✅ موافقة</button>
          <button class="btn2" style="flex:1;background:rgba(232,93,82,.14);color:var(--danger)" onclick="rejectDriver('${a.driverId}')">❌ رفض</button>
        </div>
      </div>`).join('')}`:''}
    ${approved.length?`<div class="sec-t"><h3>مناديب موثّقين</h3><span class="num">${approved.length}</span></div>
      <div class="card">${approved.map(a=>`<div class="row">
        <span class="av">🛵</span><span style="flex:1"><span class="n">${a.driverName}</span>
        <span class="s" dir="ltr">${a.phone||''}</span></span><span class="bdg b-active">موثّق</span></div>`).join('')}</div>`:''}
    ${rejected.length?`<div class="sec-t"><h3>مرفوضين</h3><span class="num">${rejected.length}</span></div>
      <div class="card">${rejected.map(a=>`<div class="row">
        <span class="av">🛵</span><span style="flex:1"><span class="n">${a.driverName}</span>
        <span class="s">${a.reason||''}</span></span><span class="bdg b-danger">مرفوض</span></div>`).join('')}</div>`:''}
    <div style="height:14px"></div></div>`;
}
</script>
</body></html>
